# Tema de login do logistic-platform.
#
# parent=base (e não `keycloak`): o tema `keycloak` carrega três folhas do PatternFly
# (v3 e v4) e prende o markup ao grid do Bootstrap. Como o objetivo é a mesma cara do
# webui — tokens de cor de logistic-webui/src/style.css, ícones da própria aplicação —
# herdar do `base` sai mais barato: ele traz só os .ftl com a lógica dos fluxos
# (login, erro, expiração, troca de senha) e nenhum estilo. O que se paga por isso é
# mapear abaixo cada `kc*Class` para uma classe nossa, porque os .ftl do base escrevem
# essas propriedades no HTML e, sem mapeamento, os elementos saem sem classe nenhuma.
#
# `import=common/keycloak` continua porque o template referencia `url.resourcesCommonPath`
# no importmap do rfc4648 (usado pelos fluxos de passkey/WebAuthn).
parent=base
import=common/keycloak

styles=css/logistic.css

meta=viewport==width=device-width,initial-scale=1

##### Estrutura da página
kcHtmlClass=kc-html
kcBodyClass=kc-body
kcFormCardClass=kc-card
kcFormHeaderClass=kc-card-header
kcContentWrapperClass=kc-content-wrapper
kcSignUpClass=kc-info
kcInfoAreaWrapperClass=kc-info-wrapper
kcResetFlowIcon=reset-flow-icon
kcSrOnlyClass=sr-only
kcMarginTopClass=mt

##### Formulário
kcFormClass=kc-form
kcFormGroupClass=field
kcFormGroupErrorClass=has-error
kcFormSettingClass=field-options
kcFormOptionsClass=field-options-left
kcFormOptionsWrapperClass=field-options-right
kcFormButtonsClass=field
kcFormButtonsWrapperClass=field-buttons
kcLabelClass=field-label
kcLabelWrapperClass=field-label-wrapper
kcInputClass=field-input
kcInputWrapperClass=field-input-wrapper
kcInputGroup=input-group
kcTextareaClass=field-input
kcInputErrorMessageClass=field-error
kcInputHelperTextBeforeClass=field-help
kcInputHelperTextAfterClass=field-help

##### Checkbox e radio
kcInputClassCheckbox=checkbox
kcInputClassCheckboxInput=checkbox-input
kcInputClassCheckboxLabel=checkbox-label
kcInputClassRadio=radio
kcInputClassRadioInput=radio-input
kcInputClassRadioLabel=radio-label
kcInputClassRadioCheckboxLabelDisabled=is-disabled
kcCheckInputClass=checkbox-input
kcCheckboxInputClass=checkbox-input

##### Botões (mesmos tokens do webui: primário âmbar, secundário fantasma)
kcButtonClass=btn
kcButtonPrimaryClass=btn-primary
kcButtonSecondaryClass=btn-ghost
kcButtonDefaultClass=btn-ghost
kcButtonBlockClass=btn-block
kcButtonLargeClass=btn-lg

##### Alertas — o ícone é desenhado em SVG pelo template, não por fonte de ícone
kcAlertClass=alert
kcAlertTitleClass=alert-text

##### Visibilidade da senha — as classes viram máscara SVG no CSS (o base usaria
##### FontAwesome, que só existe no tema `keycloak`). O passwordVisibility.js do base
##### troca uma classe pela outra no clique.
kcFormPasswordVisibilityButtonClass=pw-toggle
kcFormPasswordVisibilityIconShow=pw-icon pw-icon-show
kcFormPasswordVisibilityIconHide=pw-icon pw-icon-hide

##### Seletor de idioma (só aparece com mais de um locale suportado no realm)
kcLocaleMainClass=locale
kcLocaleWrapperClass=locale-wrapper
kcLocaleDropDownClass=locale-dropdown
kcLocaleListClass=locale-list
kcLocaleListItemClass=locale-item
kcLocaleItemClass=locale-link

##### Seleção de autenticador e OTP (fluxos secundários, não usados hoje —
##### mapeados para a tela não sair sem estilo se alguém habilitar 2FA)
kcSelectAuthListClass=auth-list
kcSelectAuthListItemClass=auth-item
kcSelectAuthListItemHeadingClass=auth-item-title
kcSelectAuthListItemDescriptionClass=auth-item-desc
kcSelectAuthListItemBodyClass=auth-item-body
kcSelectAuthListItemIconClass=auth-item-icon
kcSelectAuthListItemFillClass=auth-item-fill
kcSelectAuthListItemArrowClass=auth-item-arrow
kcLoginOTPListClass=otp-list
kcLoginOTPListInputClass=otp-input
kcLoginOTPListItemHeaderClass=otp-item
kcLoginOTPListItemTitleClass=otp-item-title

##### Provedores sociais (o realm não tem nenhum; mapeado por completude)
kcFormSocialAccountSectionClass=social
kcFormSocialAccountListClass=social-list
kcFormSocialAccountListGridClass=social-grid
kcFormSocialAccountListButtonClass=btn btn-ghost btn-block
kcFormSocialAccountListButtonDisabledClass=is-disabled
kcFormSocialAccountGridItem=social-grid-item
kcFormSocialAccountNameClass=social-name
