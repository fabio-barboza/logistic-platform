server:
  port: 8080
spring:
  application:
    name: logistic-agent
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  datasource:
    url: ${AGENT_DB_URL}
    username: ${AGENT_DB_USER}
    password: ${AGENT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      base-url: ${LLM_BASE_URL}
      api-key: ${LLM_API_KEY}
      chat:
        options:
          model: ${LLM_MODEL}
          temperature: 0.7
          max-tokens: 16000
    chat:
      observations:
        include-error-logging: true
      memory:
        repository:
          jdbc:
            initialize-schema: always
    mcp:
      client:
        type: SYNC
        request-timeout: 60s
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            logistic:
              url: ${LOGISTIC_API_URL}
              endpoint: /mcp

langfuse:
  enabled: ${LANGFUSE_CLIENT_ENABLED:false}

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    enabled: ${langfuse.enabled}
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${LANGFUSE_OTLP_ENDPOINT:http://localhost:8060/api/public/otel/v1/traces}
          headers:
            Authorization: "Basic ${LANGFUSE_AUTH:}"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logistic:
  backend:
    url: ${LOGISTIC_API_URL}
    check-interval: 15000
    initial-delay: 5000
  agent:
    state-purge:
      interval: 3600000
      chat-memory-ttl: 24h
  security:
    audience: logistic-agent
    keycloak:
      token-uri: ${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/token
      client-id: logistic-agent
      client-secret: ${KEYCLOAK_AGENT_CLIENT_SECRET}
      target-audience: logistic-api

logging:
  level:
    br.com.fabio.logisticagent: INFO
