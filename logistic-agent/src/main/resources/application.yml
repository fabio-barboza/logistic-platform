server:
  port: 8080
spring:
  application:
    name: logistic-agent
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/logistic}
  ai:
    openai:
      base-url: ${LLM_BASE_URL:http://localhost:8200}
      api-key: not-needed
      chat:
        options:
          model: ${LLM_MODEL:qwen3.6:35B}
          temperature: 0.7
          max-tokens: 16000
          # Desliga o reasoning do Qwen3.6. O llama-server sobe com --jinja e o template do modelo
          # ativa o thinking por padrão: cada chamada gastava algumas centenas de tokens de
          # <think> antes de emitir a tool call ou a resposta. Como o agent só escolhe tool e
          # formata resultado, o reasoning não agrega e só custa latência.
          # Chaves entre colchetes para o binder do Spring não normalizar o underscore.
          extra-body:
            "[chat_template_kwargs]":
              "[enable_thinking]": false
    # log-prompt/log-completion do Spring AI só escrevem no log da aplicação; quem manda
    # prompt e resposta para o Langfuse é o LangfuseObservabilityConfig, via atributo de span.
    chat:
      observations:
        include-error-logging: true
    mcp:
      client:
        type: SYNC
        request-timeout: 60s
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            logistic:
              url: http://localhost:8081
              endpoint: /mcp

# Observabilidade opcional: traces OTLP para o Langfuse.
# Desligado por padrão — quem roda a stack sem Langfuse não precisa fazer nada.
# Para ligar: preencha o .env da raiz (LANGFUSE_CLIENT_ENABLED=true + as chaves do projeto) e
# suba pelo start.sh, que deriva o LANGFUSE_AUTH = base64("public-key:secret-key").
# Independente do LANGFUSE_SERVER_ENABLED (esse controla só os containers via Compose) — dá
# pra apontar pra um Langfuse rodando em outra máquina sem subir nada localmente.
langfuse:
  enabled: ${LANGFUSE_CLIENT_ENABLED:false}

management:
  # O starter de OTel traz também o registry de métricas, que por padrão fica publicando
  # para um collector em localhost:4318. Aqui só interessa trace.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    enabled: ${langfuse.enabled}
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${LANGFUSE_OTLP_ENDPOINT:http://localhost:8060/api/public/otel/v1/traces}
          headers:
            Authorization: "Basic ${LANGFUSE_AUTH:}"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logistic:
  backend:
    url: http://localhost:8081
    check-interval: 15000
    initial-delay: 5000
  security:
    # Audiencia esperada no token que chega do browser. Validacao de audience e regra
    # inviolavel deste plano: sem ela, um token emitido para outro recurso seria aceito
    # aqui (confused deputy).
    audience: logistic-agent
    keycloak:
      token-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/logistic}/protocol/openid-connect/token
      client-id: logistic-agent
      client-secret: ${KEYCLOAK_AGENT_CLIENT_SECRET:logistic-agent-secret}
      # Audiencia que o token trocado precisa ter para a API aceitar.
      target-audience: logistic-api

logging:
  level:
    br.com.fabio.logisticagent: INFO
