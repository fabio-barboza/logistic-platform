server:
  port: 8081
spring:
  application:
    name: logistic-api
  datasource:
    # prepareThreshold=0 desliga prepared statements no lado do servidor (pgjdbc). Sem isso, o
    # Postgres não consegue inferir o tipo de alguns parâmetros nas queries JPQL com "IN :lista"
    # e "CAST(:param AS string)" do padrão de filtro dinâmico (erro "could not determine data
    # type of parameter").
    url: jdbc:postgresql://localhost:5432/logisticdb?prepareThreshold=0
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    mcp:
      server:
        name: logistic-mcp
        version: 1.0.0
        protocol: STREAMABLE
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logistic:
  readonly-datasource:
    url: jdbc:postgresql://localhost:5432/logisticdb?prepareThreshold=0
    username: logistic_ro
    password: logistic_ro
    connection-init-sql: "SET statement_timeout = '30s'"
