server:
  port: 8081
spring:
  application:
    name: logistic-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  datasource:
    url: ${API_DB_URL}
    username: ${API_DB_USER}
    password: ${API_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/roles
  ai:
    mcp:
      server:
        name: logistic-mcp
        version: 1.0.0
        protocol: STREAMABLE
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logistic:
  readonly-datasource:
    url: ${API_DB_URL}
    username: ${API_READONLY_DB_USER}
    password: ${API_READONLY_DB_PASSWORD}
    connection-init-sql: "SET statement_timeout = '30s'"
  security:
    audience: logistic-api
